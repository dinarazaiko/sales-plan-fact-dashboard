name: Отчёт в Telegram

on:
  # Запускает Qlik-бот сразу после публикации свежих данных (пн–пт).
  # Расписание (cron) убрано 23.11.2026: GitHub запускал его с опозданием на 8–9 часов.
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Собрать и отправить отчёт
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://dinarazaiko.github.io/sales-plan-fact-dashboard/daily/
        run: python scripts/telegram_report.py --data data.json --send
